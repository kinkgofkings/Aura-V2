# HAProxy owns public port 443 on the Aura host.
# TLS ClientHello goes to nginx on 127.0.0.1:8443.
# Anything else (TURN TCP) goes to coturn on 127.0.0.1:3478.
# The Lightsail firewall allows TCP 443 and does not allow a normal TURN port range.

global
    log /dev/log local0
    maxconn 8000
    user haproxy
    group haproxy
    daemon

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 24h
    timeout server 24h

frontend aura_443
    bind *:443
    bind :::443 v6only
    tcp-request inspect-delay 3s
    tcp-request content accept if { req.ssl_hello_type 1 } or { req.len gt 0 }
    use_backend aura_web if { req.ssl_hello_type 1 }
    default_backend aura_turn

backend aura_web
    server nginx 127.0.0.1:8443

backend aura_turn
    server coturn 127.0.0.1:3478
