# Nginx configuration for Aura Social & Sanctuary
server {
    listen 80;
    server_name aura.webcraftstudio.cloud webcraftstudio.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aura.webcraftstudio.cloud webcraftstudio.cloud;

    # SSL Certificates (managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/aura.webcraftstudio.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aura.webcraftstudio.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Maximum file upload size (videos, audio, sermons)
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Pass all requests to Node.js / Express backend on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Byte Range & Media Streaming configuration
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static uploads caching
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_cache_bypass $http_range;
        proxy_no_cache $http_range;
        add_header Cache-Control "public, max-age=86400";
    }
}
