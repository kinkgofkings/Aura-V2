name: Deploy Aura

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aura-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Aura-prod
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Server Update & Build
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST || '54.80.229.108' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.AURA_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "🚀 [Deploy] Triggered by GitHub push to main"
            cd /home/ubuntu/Aura-prod
            chmod +x scripts/*.sh 2>/dev/null || true
            ./scripts/update-server.sh
            echo "✅ [Deploy] Server update completed successfully!"
